configDependencies:
    "@obusk/pnpm-plugin-defaults": 0.6.4

minimumReleaseAgeExclude:
    - next
    - "@next/*"
    - eslint-config-next
    - "@obusk/eslint-config-next"

allowBuilds:
    "@parcel/watcher": true
    sharp: true
    simple-git-hooks: true
    unrs-resolver: true

overrides:
    "@types/react": 19.2.18
    "@types/react-dom": 19.2.5
    postcss@<8.5.10: ^8.5.10

trustPolicyExclude:
    - eslint-import-resolver-typescript@3.10.1
    - semver@6.3.1
